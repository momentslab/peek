[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peek"
version = "0.1.0"
description = "PEEK: Picking Essential frames via Efficient Knowledge distillation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Killian Steunou" }]
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "scipy",
    "torch>=2.1",
    "tqdm",
    "imageio-ffmpeg",
    "transformers>=4.49",
    "open_clip_torch>=2.30",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest"]
# Downstream captioning evaluation (docs/REPRODUCING.md). Versions match the paper runs.
eval = [
    "transformers==5.5.4",
    "accelerate",
    "qwen-vl-utils==0.0.14",
    "pycocoevalcap==1.2",
    # ffmpeg 7.0.2, as used for the paper's ANC frames; newer builds change frame counts.
    "imageio-ffmpeg==0.6.0",
    "decord==0.6.0; platform_machine == 'x86_64'",
    "decord2; platform_machine == 'aarch64'",
]

[tool.setuptools.packages.find]
where = ["src"]
